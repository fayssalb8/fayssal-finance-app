name: smart_kitchen_finance
description: "تطبيق Flutter لإدارة الدخل الشخصي في مطابخ المبيعات: الراتب، الساعات الإضافية، البونص، الغياب، عمولات المبيعات وتقارير PDF."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  sqflite: ^2.4.2+1
  path: ^1.9.1
  # مثبتة على إصدار flutter_localizations المطلوب في Flutter 3.41.x
  intl: 0.20.2
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0

# يستخدم مكتبة SQLite الموجودة في النظام بدلاً من تحميلها من الإنترنت
# (مهم فقط لاختبارات سطح المكتب / التطوير).
hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3
      name: sqlite3

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/NotoNaskhArabic.ttf

  fonts:
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf

